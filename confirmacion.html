<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta confirmada en TodoEventos.pe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:var(--app-bg); --card:#fff; --card2:var(--hueso); --line:var(--linea);
  --fg:var(--tinta); --sub:var(--tinta-2); --red:#B91C1C;
  --ac:#7C3AED; --ac-2:#6D28D9; --ac-glow:rgba(124,58,237,.35);
  --green:#15803D; --green-soft:rgba(74,222,128,.12); --green-line:rgba(74,222,128,.30);
  --glow1:rgba(124,58,237,.16); --glow2:rgba(109,40,217,.10);
}
/* ── Cliente: paleta morada/índigo (marketplace) ── */
body.role-cliente{
  --ac:#7C3AED; --ac-2:#6D28D9; --ac-glow:rgba(124,58,237,.35);
  --glow1:rgba(124,58,237,.16); --glow2:rgba(109,40,217,.10);
}
/* ── Proveedor: paleta naranja/dorado (dashboard) ── */
body.role-proveedor{
  --ac:#EA580C; --ac-2:#B45309; --ac-glow:rgba(234,88,12,.35);
  --glow1:rgba(194,65,12,.14); --glow2:rgba(251,191,36,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:clip;} /* los glows de fondo se salían del borde en celular */
body{font-family:'Epilogue',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
.glow.g1{width:420px;height:420px;background:var(--glow1);top:-120px;right:-100px;}
.glow.g2{width:360px;height:360px;background:var(--glow2);bottom:-120px;left:-100px;}

.wrap{width:100%;max-width:440px;position:relative;z-index:1;text-align:center;}
.logo{font-size:22px;font-weight:700;text-decoration:none;display:block;margin-bottom:34px;}
.logo .lp{color:var(--ac);}
.logo .lo{color:var(--ac-2);}
.logo .dot{color:var(--tinta-3);font-weight:400;}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 30px;}

.check-badge{width:72px;height:72px;border-radius:50%;background:var(--green-soft);border:1px solid var(--green-line);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
.check-badge i{font-size:34px;color:var(--green);}

h1{font-size:21px;font-weight:700;margin-bottom:10px;}
.sub{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:6px;}
.nombre{color:var(--fg);font-weight:600;}

.estado{margin-top:20px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--sub);display:none;align-items:center;justify-content:center;gap:8px;}
.estado.show{display:flex;}
.estado.error{color:var(--red);}
.spinner{width:14px;height:14px;border:2px solid rgba(124,58,237,.25);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;font-size:14.5px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;border:none;margin-top:28px;transition:opacity .16s;}
.btn:hover{opacity:.9;}
.btn-primary{background:var(--ac);color:#fff;box-shadow:0 4px 14px var(--ac-glow);}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--line);}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="wrap">
  <span class="logo"><span class="lp">Todo</span><span class="lo">Eventos</span><span class="dot">.pe</span></span>

  <div class="card">
    <div class="check-badge"><i class="ti ti-circle-check"></i></div>
    <h1 id="titulo">Listo, tu cuenta ya está activa</h1>
    <p class="sub" id="subtitulo">Ya puedes entrar y empezar a usar TodoEventos.pe.</p>

    <div class="estado" id="estado">
      <span class="spinner"></span> <span id="estado-texto">Estamos verificando tu cuenta…</span>
    </div>

    <a href="index.html" class="btn btn-primary"><i class="ti ti-home"></i> Ir al inicio</a>
    <a href="login.html" class="btn btn-secondary" id="btn-secundario"><i class="ti ti-login-2"></i> Iniciar sesión</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vqnyaozauljtashpjfoo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxbnlhb3phdWxqdGFzaHBqZm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDM0NzIsImV4cCI6MjA5OTI3OTQ3Mn0.0JT-UAQnSUygXPNjI69Sf3Rg3mv_NeTwwz9-7vnWcno';

let sb = null;
try {
  // Lee la sesión de donde haya quedado guardada (localStorage si se
  // marcó "Recordarme" al iniciar sesión, o sessionStorage si no).
  const storageAdapter = {
    getItem: (key) => localStorage.getItem(key) ?? sessionStorage.getItem(key),
    setItem: (key, value) => {
      const recordar = localStorage.getItem('te_remember') !== 'false';
      if(recordar){
        localStorage.setItem(key, value);
        sessionStorage.removeItem(key);
      } else {
        sessionStorage.setItem(key, value);
        localStorage.removeItem(key);
      }
    },
    removeItem: (key) => {
      localStorage.removeItem(key);
      sessionStorage.removeItem(key);
    }
  };
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: storageAdapter }
  });
} catch(e) {
  console.error('No se pudo inicializar Supabase:', e);
}

function mostrarEstado(texto, esError){
  const estado = document.getElementById('estado');
  document.getElementById('estado-texto').textContent = texto;
  estado.classList.toggle('error', !!esError);
  estado.classList.add('show');
}

async function verificarSesion(){
  if(!sb){
    mostrarEstado('No se pudo conectar con el servidor para verificar tu cuenta.', true);
    return;
  }

  // Recuperación de contraseña: Supabase manda type=recovery en el hash del
  // enlace del correo. Antes esta pantalla no lo distinguía del enlace normal
  // de "cuenta confirmada" y mandaba directo al dashboard, así que el usuario
  // nunca llegaba al formulario para poner su contraseña nueva.
  const esRecovery = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('type') === 'recovery';

  // El SDK de Supabase detecta automáticamente el token que viene en la URL
  // (#access_token=...) y crea la sesión. La esperamos aquí antes de decidir
  // adónde mandar al usuario, para que la sesión ya haya quedado guardada.
  const { data, error } = await sb.auth.getSession();

  if(esRecovery && data.session){
    window.location.replace('cuenta.html?reset=1');
    return;
  }

  if(error || !data.session){
    // No había token en la URL, o no era válido: no es necesariamente un
    // error grave (puede que alguien entre a esta página directamente).
    document.getElementById('subtitulo').textContent =
      'Ya puedes iniciar sesión con tu correo y contraseña.';
    return;
  }

  const usuario = data.session.user;
  const { data: perfil } = await sb
    .from('profiles')
    .select('full_name, role')
    .eq('id', usuario.id)
    .single();

  if(perfil && perfil.role){
    // Aplica la paleta de color (morado=cliente, naranja=proveedor),
    // igual que en el login, para que se sienta parte del mismo flujo.
    document.body.classList.add('role-' + perfil.role);
  }

  // Red de seguridad: si el proveedor confirmó su correo por el ENLACE del mail
  // (no tecleando el código en la pestaña del registro), la solicitud nunca se
  // llegó a insertar y el admin no la veía. Acá, con la sesión ya activa, la
  // creamos desde los datos que dejamos guardados en el registro. Es
  // idempotente: si ya existe una solicitud, no hace nada.
  if(perfil && perfil.role === 'proveedor'){
    await asegurarSolicitudProveedor(usuario);
  }

  const mensajePorRol = {
    cliente: 'Ya puedes entrar al catálogo y armar tu evento.',
    proveedor: 'Ya puedes manejar tu negocio desde tu panel.'
  };

  if(perfil && perfil.full_name){
    const mensajeRol = mensajePorRol[perfil.role] || 'Tu cuenta ya está activa y lista para usarse.';
    document.getElementById('subtitulo').innerHTML =
      'Bienvenido/a, <span class="nombre">' + perfil.full_name + '</span>. ' + mensajeRol;
  }

  // Como ya tiene sesión activa, le damos acceso directo a su espacio
  if(perfil && perfil.role){
    const destino = perfil.role === 'proveedor' ? 'dashboard.html' : 'catalogo.html';
    const btn = document.getElementById('btn-secundario');
    btn.href = destino;
    btn.innerHTML = '<i class="ti ti-arrow-right"></i> ' +
      (perfil.role === 'proveedor' ? 'Ir a mi dashboard' : 'Ir al marketplace');
  }
}

// Crea la solicitud de proveedor si todavía no existe (caso: confirmó por el
// enlace del correo, así que el registro nunca la insertó). Los datos del
// negocio quedaron guardados en localStorage durante el registro. Las fotos no
// se rescatan por esta vía (se subieron solo si tecleó el código en la pestaña
// original); el admin igual ve la solicitud y puede aprobarla.
async function asegurarSolicitudProveedor(usuario){
  try {
    const { data: existente } = await sb
      .from('solicitudes_proveedor')
      .select('id')
      .eq('user_id', usuario.id)
      .maybeSingle();
    if(existente) return; // ya hay solicitud: nada que hacer

    const raw = localStorage.getItem('te_pending_verification');
    if(!raw) return;
    let pendiente;
    try { pendiente = JSON.parse(raw); } catch(e){ return; }

    // Solo si los datos guardados son de ESTA cuenta y traen info de negocio.
    const emailSesion = (usuario.email || '').toLowerCase();
    if(!pendiente || (pendiente.email || '').toLowerCase() !== emailSesion) return;
    if(pendiente.role !== 'proveedor' || !pendiente.datosProveedor) return;

    const { error } = await sb
      .from('solicitudes_proveedor')
      .insert({ user_id: usuario.id, ...pendiente.datosProveedor });
    if(!error) localStorage.removeItem('te_pending_verification');
    else console.error('No se pudo crear la solicitud de proveedor:', error);
  } catch(e){
    console.error('Error asegurando la solicitud de proveedor:', e);
  }
}

verificarSesion();
</script>
<script src="feedback.js"></script>
</body>
</html>
